name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 用仓库自带的 gradle wrapper 构建（与本地一致），并依次跑
      # 单元测试 + lint + 打包。任一测试/lint 失败则整个 job 失败、
      # 不出 APK，从而「真机不翻车」——坏代码合入前就在 CI 拦下。
      - name: Run unit tests
        uses: gradle/gradle-build-action@v3
        with:
          arguments: testDebugUnitTest

      - name: Run lint
        uses: gradle/gradle-build-action@v3
        with:
          arguments: lintDebug

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elder-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
